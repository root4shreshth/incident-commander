# Runs `praetor verify` on every PR that touches policies/, on the whole
# policy library on every push to main, and posts a Markdown report as a
# comment on the PR. Blocks merge if any policy in the diff FAILs.
#
# What "FAIL" means: the policy either (a) fails to fix a scenario it
# claims to fix, (b) misfires on a scenario it doesn't claim, or (c) fires
# and produces net-negative reward (breaks things). See
# praetor_verify/runner.py for the full verdict matrix.
#
# The `_bad_example_*.yaml` policies are excluded from the required-pass
# set - they exist as regression tests for the verifier itself.

name: Praetor Playbook Verifier

on:
  pull_request:
    paths:
      - "policies/**.yaml"
      - "policies/**.yml"
      - "praetor_verify/**"
      - ".github/workflows/policy-verify.yml"
  push:
    branches: [main]
    paths:
      - "policies/**.yaml"
      - "policies/**.yml"
      - "praetor_verify/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  verify:
    name: Verify policies against 12-scenario library
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install --upgrade uv

      - name: Install dependencies
        run: uv sync

      - name: Verify production policies
        id: verify_prod
        run: |
          # All policies EXCEPT the intentionally-bad regression ones.
          mapfile -t policies < <(find policies -type f \
            \( -name "*.yaml" -o -name "*.yml" \) \
            ! -name "_bad_example_*" | sort)
          if [ ${#policies[@]} -eq 0 ]; then
            echo "No production policies found - skipping."
            exit 0
          fi
          echo "Verifying: ${policies[@]}"
          uv run python scripts/verify_policy.py "${policies[@]}" \
            --format markdown \
            --output /tmp/verify_report.md
          {
            echo "report<<EOF"
            cat /tmp/verify_report.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Verify bad-example regression guard
        run: |
          # This policy is INTENDED to fail. If the verifier says it passes,
          # that's a regression in the verifier itself.
          set +e
          uv run python scripts/verify_policy.py \
            policies/_bad_example_trigger_happy.yaml \
            --format terminal --no-color
          code=$?
          if [ "$code" -ne 1 ]; then
            echo "BUG: bad-example policy did not FAIL as expected (exit $code)."
            exit 1
          fi
          echo "Regression guard OK - bad-example policy correctly rejected."

      - name: Comment PR with report
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('/tmp/verify_report.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report,
            });
